# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main
- master

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: echo "Message Queued: Pipeline triggered successfully!"
  displayName: 'Queue Message'

- task: AzureCLI@2
  inputs:
    azureSubscription: '<AzureSubscriptionServiceConnection>'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Performing queue operations..."
      # Add Azure-specific CLI commands here, for example:
      # az servicebus namespace create --resource-group <ResourceGroupName> --name <NamespaceName> --location <Location>
      # az servicebus queue create --resource-group <ResourceGroupName> --namespace-name <NamespaceName> --name <QueueName>

- script: echo "Hello, world!"
  displayName: 'Run a one-line script'

- script: |
    echo "Add other tasks to build, test, and deploy your project."
    echo "See https://aka.ms/yaml for more examples and details."
  displayName: 'Run a multi-line script'
